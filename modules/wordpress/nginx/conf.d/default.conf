server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location / {
        default_type text/html;
        return 200 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>se2Code Stack Server</title><style>body{background:#0b0f19;color:#00f2fe;font-family:system-ui,-apple-system,sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;text-align:center;}h1{font-size:2.5rem;color:#4facfe;margin-bottom:10px;}p{color:#94a3b8;font-size:1.1rem;line-height:1.6;}b{color:#38ef7d;}</style></head><body><div><h1>⚡ se2Code Stack Server</h1><p>Servidor de alto rendimiento activo y listo.<br>Usa el comando <b>se2code</b> en tu terminal para desplegar tu primer sitio WordPress.</p></div></body></html>';
    }
}
