fastcgi_cache WORDPRESS;

set $skip_cache 0;

# No cachear sesiones activas
if ($http_cookie ~* "comment_author|wordpress_[a-f0-9]+|wp-postpass|wordpress_no_cache|wordpress_logged_in") {
    set $skip_cache 1;
}

# No cachear peticiones POST
if ($request_method = POST) {
    set $skip_cache 1;
}

# No cachear panel admin, sitemaps ni feeds
if ($request_uri ~* "/wp-admin/|/xmlrpc.php|wp-.*.php|/feed/|index.php|sitemap(_index)?.xml") {
    set $skip_cache 1;
}

# No cachear parámetros en URL
if ($query_string != "") {
    set $skip_cache 1;
}

# No cachear sesiones de Elementor ni REST API
if ($query_string ~* "elementor") {
    set $skip_cache 1;
}
if ($request_uri ~* "/wp-json/|/elementor") {
    set $skip_cache 1;
}

fastcgi_cache_bypass $skip_cache;
fastcgi_no_cache $skip_cache;

add_header X-FastCGI-Cache $upstream_cache_status always;
add_header X-Cache-Status $upstream_cache_status always;
add_header X-Cache-Enabled "True" always;
