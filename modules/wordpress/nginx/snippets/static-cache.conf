location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf|txt|woff|woff2|ttf|svg|eot|webp|avif)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
}

location ~* \.(mp4|webm|ogg|mp3|wav|flac|zip|rar|7z|tar|gz)$ {
    expires 7d;
    add_header Cache-Control "public";
    access_log off;
}

location ~* \.(html|htm|xml|json)$ {
    expires 1h;
    add_header Cache-Control "public, must-revalidate";
}
